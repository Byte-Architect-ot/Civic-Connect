services:
  mongodb:
    image: mongo:7.0
    container_name: nagriksetu-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - nagriksetu-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: nagriksetu-ml-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:5000,http://frontend:80,http://backend:5000
      - PORT=8000
    networks:
      - nagriksetu-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  chatbot-service:
    build:
      context: ./chatbot-service
      dockerfile: Dockerfile
    container_name: nagriksetu-chatbot-service
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - PINECONE_API_KEY=${PINECONE_API_KEY:-}
      - PINECONE_INDEX_NAME=${PINECONE_INDEX_NAME:-nagriksetu}
      - HF_API_KEY=${HF_API_KEY:-}
      - HF_API_URL=${HF_API_URL:-https://api-inference.huggingface.co/models/sentence-transformers/all-MiniLM-L6-v2}
    networks:
      - nagriksetu-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nagriksetu-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/civic_connect}
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_123}
      - ADMIN_KEY=${ADMIN_KEY:-CIVIC_ADMIN_2026}
      - CHATBOT_SERVICE_URL=http://chatbot-service:5001
      - ML_SERVICE_URL=http://ml-service:8000
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173,http://frontend:80
      - ROBOFLOW_API_KEY=${ROBOFLOW_API_KEY:-}
      - ROBOFLOW_URL=${ROBOFLOW_URL:-https://detect.roboflow.com/civic-issues-qj5pb/2}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      ml-service:
        condition: service_started
      chatbot-service:
        condition: service_started
    networks:
      - nagriksetu-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nagriksetu-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - nagriksetu-network

networks:
  nagriksetu-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  backend_uploads:
    driver: local
